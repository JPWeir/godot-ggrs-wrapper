[package]
name = "godot-ggrs-wrapper"
description = "A Rust GDExtension project to provide GGRS to the Godot Engine"
version = "0.6.0"
edition = "2021"
readme = "README.md"
authors = ["Marcello Haddeman <haddemanmarcello@gmail.com>"]
repository = "https://github.com/marcello505/godot-ggrs-wrapper"
license = "MIT"
keywords = ["godot", "ggrs", "gamedev", "networking", "rollback"]
categories = ["network-programming", "game-development"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
godot = "0.2.4"
ggrs = "0.11"

[lib]
crate-type = ["cdylib"]
